# Manual only (no schedule): these jobs need the Workspaces shared Docker and the Dev VM browser, which a hosted runner does not have; see docs/ci.md.
# Nightly: plugin compatibility, selected WordPress/PHP runtime cells, and a scaffolded theme smoke test.
name: nightly
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make init-env
      - run: make demo THEME=jooservices
      - run: MATRIX_VARIANT=latest-php8.3-01-seo make test-matrix THEME=jooservices ARGS="--child-theme --only yoast,rankmath,aioseo,seopress"
      - run: MATRIX_VARIANT=latest-php8.3-02-cache make test-matrix THEME=jooservices ARGS="--child-theme --only litespeed-cache,wp-rocket,w3-total-cache,autoptimize"
      - run: MATRIX_VARIANT=latest-php8.3-03-language make test-matrix THEME=jooservices ARGS="--child-theme --only polylang,wpml,translatepress"
      - run: MATRIX_VARIANT=latest-php8.3-04-forms make test-matrix THEME=jooservices ARGS="--child-theme --only cf7,wpforms,fluentform"
      - run: MATRIX_VARIANT=latest-php8.3-05-media make test-matrix THEME=jooservices ARGS="--child-theme --only smush,shortpixel,ewww,tablepress"
      - run: MATRIX_VARIANT=latest-php8.3-06-site make test-matrix THEME=jooservices ARGS="--child-theme --only jetpack,site-kit,acf,akismet,wordfence"
      - run: MATRIX_VARIANT=latest-php8.3-07-basic make test-matrix THEME=jooservices ARGS="--child-theme --only woocommerce,elementor"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-matrix
          path: artifacts/reports/matrix
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.6'
            php: '8.3'
          - wp: '6.7'
            php: '8.3'
          - wp: '6.8'
            php: '8.3'
          - wp: latest
            php: '8.1'
          - wp: latest
            php: '8.2'
          - wp: latest
            php: '8.3'
          - wp: latest
            php: '8.4'
          - wp: latest
            php: '8.5'
          - wp: beta
            php: '8.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make init-env
      - run: WP_VERSION=${{ matrix.wp }} WP_PHP_VERSION=${{ matrix.php }} make demo THEME=jooservices
      - run: MATRIX_VARIANT=wp-${{ matrix.wp }}-php-${{ matrix.php }} WP_VERSION=${{ matrix.wp }} WP_PHP_VERSION=${{ matrix.php }} make test-matrix THEME=jooservices ARGS="--runtime-only"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.wp }}-php-${{ matrix.php }}
          path: artifacts/reports/matrix
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: make init-env
      - run: make new-theme NAME=acme
      - run: make demo THEME=acme
  cross-engine:
    # WebKit and Firefox at 390x844, 820x1180 and 1440x900: the shared smoke specs plus the theme responsive and
    # cross-engine specs (docs/guides/testing.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: make init-env
      - run: make demo THEME=jooservices
      - run: E2E_ENGINES=${{ matrix.engine }} make test-e2e THEME=jooservices ARGS="tests/e2e/specs/shared/smoke.spec.ts themes/jooservices/tests/e2e/responsive.spec.ts themes/jooservices/tests/e2e/cross-engine.spec.ts --project=${{ matrix.engine }}-phone --project=${{ matrix.engine }}-tablet --project=${{ matrix.engine }} --project=responsive-${{ matrix.engine }}"
