# Continuous integration for pull requests and pushes to develop and main.
# Runs on a hosted runner with the host tools (docker/scripts/runtime.sh falls back to php, composer and node outside
# Workspaces). The WordPress gates (integration, E2E, perf, matrix, package, marketplace) need the Workspaces shared
# Docker and the Dev VM browser, so they run on WSL: see docs/ci.md.
name: ci
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: make lint
      - run: make analyse
      - run: node tools/check-registry.mjs
      - run: node tools/validate-schemas.mjs
      - run: node tools/docs-reference.mjs --check
      - run: node tools/docs-check.mjs
      - run: make test-tooling
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install zip and unzip (packaging tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: make test-unit
